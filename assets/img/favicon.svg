<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1554"/>
      <stop offset="100%" stop-color="#1a1060"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- M lettermark -->
  <text x="32" y="46"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="38"
        fill="url(#letter)"
        text-anchor="middle"
        letter-spacing="-1">M</text>

  <!-- Small brain dots accent (top-right) -->
  <circle cx="49" cy="13" r="3.5" fill="url(#brain)" opacity="0.9"/>
  <circle cx="42" cy="9"  r="2.5" fill="url(#brain)" opacity="0.75"/>
  <circle cx="55" cy="19" r="2"   fill="url(#brain)" opacity="0.6"/>
  <circle cx="50" cy="21" r="1.5" fill="#c084fc"     opacity="0.5"/>
</svg>
