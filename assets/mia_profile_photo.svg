<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Main gradient: deep purple to teal (brand colors) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <!-- Accent glow -->
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#6c63ff;stop-opacity:0" />
    </radialGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa" />
      <stop offset="100%" style="stop-color:#38bdf8" />
    </linearGradient>
    <!-- Icon circle gradient -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="0" fill="url(#bgGrad)" />
  <!-- Glow overlay -->
  <ellipse cx="400" cy="360" rx="360" ry="320" fill="url(#glowGrad)" />

  <!-- Decorative rings -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#6c63ff" stroke-width="1" opacity="0.15"/>
  <circle cx="400" cy="400" r="310" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.1"/>

  <!-- Icon circle background -->
  <circle cx="400" cy="295" r="120" fill="url(#circleGrad)" opacity="0.92"/>

  <!-- WhatsApp-style message bubble icon (representing AI chat) -->
  <!-- Main bubble -->
  <rect x="322" y="240" width="156" height="100" rx="22" fill="white" opacity="0.95"/>
  <!-- Bubble tail -->
  <polygon points="340,340 320,370 365,340" fill="white" opacity="0.95"/>
  <!-- Dot indicators (typing / AI thinking) -->
  <circle cx="365" cy="291" r="10" fill="url(#circleGrad)"/>
  <circle cx="400" cy="291" r="10" fill="url(#circleGrad)" opacity="0.75"/>
  <circle cx="435" cy="291" r="10" fill="url(#circleGrad)" opacity="0.5"/>
  <!-- Sparkle / AI star top-right of bubble -->
  <g transform="translate(460,245)" fill="#fbbf24">
    <polygon points="0,-12 3,-4 12,0 3,4 0,12 -3,4 -12,0 -3,-4" opacity="0.9"/>
  </g>

  <!-- Brand name "mia" -->
  <text x="400" y="500"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="148"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="8"
        fill="url(#textGrad)">mia</text>

  <!-- Tagline -->
  <text x="400" y="570"
        font-family="'Arial', sans-serif"
        font-size="30"
        font-weight="400"
        text-anchor="middle"
        letter-spacing="4"
        fill="#94a3b8"
        opacity="0.85">AI · WhatsApp · Leads</text>

  <!-- Bottom accent line -->
  <rect x="180" y="610" width="440" height="3" rx="2" fill="url(#textGrad)" opacity="0.6"/>
</svg>
